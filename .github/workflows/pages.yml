name: Deploy dashboard to GitHub Pages

# Publishes the accessibility dashboard to GitHub Pages.
#
# Single source of truth: viz/dashboard.html. This workflow builds the
# published site from it in CI (copying it to index.html), so there is no
# committed copy to keep in sync — edit viz/dashboard.html and push.
#
# Pages must be enabled once (Settings -> Pages -> Source: GitHub Actions);
# configure-pages with enablement:true keeps it on thereafter.

on:
  push:
    branches: ["claude/csv-cleaning-visualization-4w3ay0"]
    paths:
      - "viz/dashboard.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site from the dashboard source
        run: |
          mkdir -p _site
          cp viz/dashboard.html _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
